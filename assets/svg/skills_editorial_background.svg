<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" fill="none">
  <defs>
    <linearGradient id="fade" x1="150" y1="150" x2="1450" y2="760" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2C180D" stop-opacity="0.08"/>
      <stop offset="0.5" stop-color="#2C180D" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#2C180D" stop-opacity="0.04"/>
    </linearGradient>

    <linearGradient id="lineFade" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#2C180D" stop-opacity="0.05"/>
      <stop offset="0.45" stop-color="#2C180D" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#2C180D" stop-opacity="0.08"/>
    </linearGradient>

    <pattern id="microGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" stroke="#2C180D" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>

    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
  </defs>

  <!-- very subtle technical grid -->
  <rect x="0" y="0" width="1600" height="900" fill="url(#microGrid)"/>

  <!-- large editorial arcs -->
  <path d="M-120 735 C180 360, 470 270, 790 430 C1060 565, 1260 680, 1720 210"
        stroke="url(#fade)" stroke-width="1.5"/>
  <path d="M-80 800 C210 430, 480 340, 760 485 C1030 625, 1280 700, 1660 310"
        stroke="#2C180D" stroke-opacity="0.10" stroke-width="1"/>
  <path d="M80 900 C330 555, 560 500, 815 590 C1050 675, 1260 710, 1510 505"
        stroke="#2C180D" stroke-opacity="0.07" stroke-width="1"/>

  <!-- elegant vertical contour -->
  <path d="M1190 -50 C1110 160, 1135 285, 1240 390 C1340 490, 1355 615, 1260 950"
        stroke="#2C180D" stroke-opacity="0.16" stroke-width="1.2"/>
  <path d="M1240 -60 C1165 150, 1190 275, 1290 375 C1380 470, 1405 605, 1315 940"
        stroke="#2C180D" stroke-opacity="0.08" stroke-width="1"/>

  <!-- small data points -->
  <g fill="#2C180D">
    <circle cx="790" cy="430" r="3" opacity="0.45"/>
    <circle cx="1240" cy="390" r="3" opacity="0.35"/>
    <circle cx="1260" cy="950" r="2.5" opacity="0.25"/>
    <circle cx="520" cy="350" r="2" opacity="0.22"/>
    <circle cx="1050" cy="625" r="2" opacity="0.28"/>
  </g>

  <!-- tiny coordinate ticks -->
  <g stroke="#2C180D" stroke-opacity="0.18" stroke-width="1">
    <path d="M780 420v20M770 430h20"/>
    <path d="M1230 380v20M1220 390h20"/>
    <path d="M1040 615v20M1030 625h20"/>
  </g>

  <!-- abstract botanical/sequence motif -->
  <g stroke="#2C180D" stroke-opacity="0.18" stroke-width="1.1">
    <path d="M250 710 C310 640, 365 570, 430 490 C485 423, 520 350, 535 260"/>
    <path d="M315 625 C282 598, 255 570, 235 535"/>
    <path d="M352 580 C390 557, 422 529, 447 495"/>
    <path d="M395 525 C363 493, 342 462, 326 425"/>
    <path d="M438 465 C474 443, 500 414, 516 380"/>
    <path d="M474 407 C448 376, 432 347, 424 315"/>
    <path d="M505 340 C531 318, 549 292, 558 262"/>
  </g>

  <!-- second ultra-thin echo -->
  <path d="M270 715 C330 645, 385 575, 450 495 C500 432, 535 355, 550 275"
        stroke="#2C180D" stroke-opacity="0.055" stroke-width="1"/>

  <!-- restrained label-like marks -->
  <g stroke="#2C180D" stroke-opacity="0.12" stroke-width="1">
    <path d="M92 126h56"/>
    <path d="M92 137h32"/>
    <path d="M1400 760h72"/>
    <path d="M1435 771h37"/>
  </g>

  <!-- warm translucent organic shape -->
  <path d="M1335 110 C1450 70, 1530 125, 1590 220 L1590 430
           C1500 390, 1430 340, 1380 265 C1340 205, 1320 150, 1335 110Z"
        fill="#DDD7CA" fill-opacity="0.22"/>

  <!-- grain-like micro dots -->
  <g fill="#2C180D" opacity="0.08">
    <circle cx="1410" cy="190" r="1"/>
    <circle cx="1440" cy="220" r="1"/>
    <circle cx="1470" cy="250" r="1"/>
    <circle cx="1500" cy="280" r="1"/>
    <circle cx="1530" cy="310" r="1"/>
    <circle cx="1375" cy="220" r="1"/>
    <circle cx="1405" cy="250" r="1"/>
    <circle cx="1435" cy="280" r="1"/>
  </g>
</svg>
